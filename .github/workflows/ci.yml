name: batoid CI

on:
  push:
    branches:
      - main
      - releases/*

  pull_request:
    branches:
      - main
      - releases/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        py: ['3.10', 3.11, 3.12, 3.13, 3.14]
        CC: [ gcc ]
        CXX: [ g++ ]
        include:
          - os: macos-latest
            py: '3.10'
            CC: cc
            CXX: c++
          - os: ubuntu-latest
            py: '3.10'
            CC: clang
            CXX: clang++
          - os: ubuntu-latest
            py: '3.14t'
            CC: gcc
            CXX: g++
            experimental: true
          - os: ubuntu-latest
            py: '3.15'
            CC: gcc
            CXX: g++
            experimental: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Print github context properties
        run: |
          echo 'event: ${{ github.event_name }}'
          echo 'sha: ${{ github.sha }}'
          echo 'ref: ${{ github.ref }}'
          echo 'head_ref: ${{ github.head_ref }}'
          echo 'base_ref: ${{ github.base_ref }}'
          echo 'event.before: ${{ github.event.before }}'
          echo 'event.after: ${{ github.event.after }}'

      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
          cache: 'pip'
          allow-prereleases: ${{ matrix.experimental == true }}

      - name: Install libfftw, etc. on linux (needed for GalSim)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo ${{ matrix.os }}
          sudo -H apt-get -qq update
          sudo -H apt-get install -y libfftw3-dev libeigen3-dev

      - name: Cache Homebrew packages
        id: cache-brew
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/Cellar/fftw
            /opt/homebrew/Cellar/eigen
            /opt/homebrew/Cellar/wget
            /opt/homebrew/opt/fftw
            /opt/homebrew/opt/eigen
            /opt/homebrew/opt/wget
          key: macos-brew-fftw-eigen-wget-v1

      - name: Install libfftw, etc. on MacOS
        if: matrix.os == 'macos-latest' && steps.cache-brew.outputs.cache-hit != 'true'
        run: brew install fftw eigen wget

      - name: Install dependencies
        env:
          LIBRARY_PATH: /opt/homebrew/lib:$LIBRARY_PATH
          LD_LIBRARY_PATH: /opt/homebrew/lib:$LD_LIBRARY_PATH
        run: |
          python -m pip install -U pip

          # Do these first to clarify potential conflicts
          pip install -U setuptools numpy

          # Standard dependencies
          pip install -U -r requirements.txt

          # Use pybind11-global to make CMake files visible
          pip install -U pybind11-global

      - name: Install remaining dependencies
        run: |
          pip install -U -r test_requirements.txt

      - name: List all installed packages for reference
        run: pip list

      - name: Build batoid
        run: CMAKE_VERBOSE_MAKEFILE=1 pip install .

      - name: Run unit tests
        run: pytest --cov=batoid --cov-report=xml --cov-config tests/.coveragerc --skip_gha --durations=8 -ra

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
