            type: ObscRectangle
            width: 1.6764
            height: 2.8454
          - # CenterPlate3
            type: ObscRectangle
            width: 0.8
            height: 3.2
            theta: 0.7853981634
          - # CenterPlate4
            type: ObscRectangle
            width: 0.8
            height: 3.2
            theta: -0.7853981634
          - # Spider1
            type: ObscRectangle
            width: 0.05
            height: 9.6
            x: 0.
            y: 0.5656854249
            theta: 0.7853981634
          - # Spider1
            type: ObscRectangle
            width: 0.05
            height: 9.6
            x: 0.
            y: 0.5656854249
            theta: 2.3561944902
