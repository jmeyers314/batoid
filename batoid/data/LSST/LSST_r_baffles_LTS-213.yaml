            type: ObscRectangle
            width: 0.05
            height: 9.6
            x: 0.
            y: -0.5656854249
            theta: 0.7853981634
          - # Spider2
            type: ObscRectangle
            width: 0.05
            height: 9.6
            x: 0.
            y: -0.5656854249
            theta: 2.3561944902
